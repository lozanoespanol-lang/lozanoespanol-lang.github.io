<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard Familiar - El Puig</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    /* CABECERA: HORA, FECHA Y CLIMA POR HORAS */
    .header {
      display: flex;
      gap: 12px;
      height: 125px;
      flex-shrink: 0;
    }
    .clock-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 280px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .clock-time { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .clock-date { font-size: 14px; color: #64748b; font-weight: 600; margin-top: 6px; text-transform: capitalize; }

    .weather-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 10px 16px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .weather-now {
      display: flex;
      flex-direction: column;
      width: 180px;
      border-right: 2px solid #f1f5f9;
      padding-right: 14px;
    }
    .weather-city { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .weather-temp-main { font-size: 38px; font-weight: 800; line-height: 1.1; }
    .weather-desc { font-size: 13px; color: #475569; font-weight: 600; }

    .weather-hours {
      display: flex;
      gap: 10px;
      flex: 1;
      justify-content: space-around;
    }
    .hour-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fafc;
      padding: 6px 8px;
      border-radius: 12px;
      width: 72px;
    }
    .hour-time { font-size: 12px; font-weight: 700; color: #64748b; }
    .hour-icon { font-size: 22px; margin: 2px 0; }
    .hour-temp { font-size: 15px; font-weight: 800; }
    .hour-rain { font-size: 11px; color: #0284c7; font-weight: 700; }

    /* CUERPO PRINCIPAL: 2 MITADES EXACTAS */
    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 12px;
      flex: 1;
      height: calc(800px - 149px);
    }

    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    /* TARJETA GRANDE: LO PRÓXIMO DE HOY */
    .next-card {
      background: #16a34a;
      color: #ffffff;
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25);
      height: 85px;
      flex-shrink: 0;
    }
    .next-info { display: flex; flex-direction: column; gap: 3px; }
    .next-label { font-size: 11px; font-weight: 800; text-transform: uppercase; opacity: 0.9; }
    .next-title { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .next-meta { font-size: 13px; font-weight: 600; opacity: 0.95; }
    .next-badge {
      background: rgba(255,255,255,0.22);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* COLUMNAS POR PERSONA (MAMÁ, SERGIO, DAVID) */
    .family-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      flex-shrink: 0;
    }
    .section-title { font-size: 14px; font-weight: 800; color: #334155; }
    .btn-add {
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-del-mode {
      background: #f1f5f9;
      color: #475569;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-del-mode.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
    }

    .family-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .person-col {
      background: #ffffff;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-top: 6px solid #ccc;
      overflow-y: auto;
    }
    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
    }
    .person-name { font-size: 15px; font-weight: 800; }
    .person-age { font-size: 11px; color: #64748b; font-weight: 700; }

    .task-item {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
    }
    .task-time { font-size: 11px; font-weight: 800; opacity: 0.8; }
    .empty-msg { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 15px; font-style: italic; }

    /* LISTA DE LA COMPRA */
    .shop-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .shop-summary {
      font-size: 12px;
      font-weight: 700;
      color: #16a34a;
      background: #dcfce7;
      padding: 4px 8px;
      border-radius: 999px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }
    .shop-btn {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 52px;
    }
    .shop-btn.active {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }
    .shop-btn.delete-mode {
      background: #ffe4e6;
      border: 2px dashed #e11d48;
      color: #be123c;
    }

    /* MODALES */
    .modal-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal h3 { font-size: 17px; font-weight: 800; }
    .input-row { display: flex; flex-direction: column; gap: 5px; }
    .input-row label { font-size: 12px; font-weight: 700; color: #475569; }
    .input-row input, .input-row select {
      padding: 10px;
      font-size: 15px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
    }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #e2e8f0;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
    .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="header">
    <div class="clock-card">
      <div class="clock-time" id="reloj">12:00</div>
      <div class="clock-date" id="fecha">Cargando...</div>
    </div>

    <div class="weather-card">
      <div class="weather-now">
        <span class="weather-city">El Puig de Santa Maria</span>
        <span class="weather-temp-main" id="temp-actual">22°</span>
        <span class="weather-desc" id="clima-desc">☀️ Despejado</span>
      </div>
      <div class="weather-hours" id="clima-horas">
        <div class="hour-item"><span class="hour-time">13:00</span><span class="hour-icon">☀️</span><span class="hour-temp">23°</span><span class="hour-rain">💧0%</span></div>
        <div class="hour-item"><span class="hour-time">14:00</span><span class="hour-icon">☀️</span><span class="hour-temp">24°</span><span class="hour-rain">💧0%</span></div>
        <div class="hour-item"><span class="hour-time">15:00</span><span class="hour-icon">⛅</span><span class="hour-temp">23°</span><span class="hour-rain">💧5%</span></div>
        <div class="hour-item"><span class="hour-time">16:00</span><span class="hour-icon">⛅</span><span class="hour-temp">22°</span><span class="hour-rain">💧10%</span></div>
      </div>
    </div>
  </div>

  <!-- CUERPO PRINCIPAL -->
  <div class="main-grid">
    <!-- IZQUIERDA -->
    <div class="left-col">
      <div class="next-card" id="tarjeta-proximo">
        <div class="next-info">
          <div class="next-label" id="prox-persona">PRÓXIMO HOY</div>
          <div class="next-title" id="prox-titulo">Sin tareas pendientes</div>
          <div class="next-meta" id="prox-hora">Añade una tarea abajo</div>
        </div>
        <div class="next-badge" id="prox-cuenta">Todo al día</div>
      </div>

      <div class="family-header">
        <span class="section-title">Tareas y citas de hoy</span>
        <button class="btn-add" onclick="abrirModalTarea()">+ Añadir tarea</button>
      </div>

      <div class="family-cols" id="columnas-familia"></div>
    </div>

    <!-- DERECHA -->
    <div class="right-col">
      <div class="shop-card">
        <div class="family-header">
          <span class="section-title">Lista de la compra</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <span class="shop-summary" id="contador-compra">0 en la lista</span>
            <button class="btn-del-mode" id="btn-modo-borrar" onclick="toggleModoBorrar()">🗑️ Borrar</button>
            <button class="btn-add" onclick="abrirModalCompra()">+ Añadir</button>
          </div>
        </div>
        <div class="shop-grid" id="grid-compra"></div>
      </div>
    </div>
  </div>

  <!-- MODAL TAREA -->
  <div class="modal-bg" id="modal-tarea">
    <div class="modal">
      <h3>Nueva tarea o cita para hoy</h3>
      <div class="input-row">
        <label>¿Para quién?</label>
        <select id="tarea-persona">
          <option value="mama">Mamá</option>
          <option value="sergio">Sergio (23)</option>
          <option value="david">David (4)</option>
        </select>
      </div>
      <div class="input-row">
        <label>Tareas rápidas:</label>
        <div class="quick-chips">
          <button type="button" class="chip" onclick="ponerTextoTarea('Sacar el lavavajillas')">Sacar lavavajillas</button>
          <button type="button" class="chip" onclick="ponerTextoTarea('Meter el lavavajillas')">Meter lavavajillas</button>
          <button type="button" class="chip" onclick="ponerTextoTarea('Tender la lavadora')">Tender lavadora</button>
          <button type="button" class="chip" onclick="ponerTextoTarea('Sacar la basura')">Sacar basura</button>
        </div>
      </div>
      <div class="input-row">
        <label>Descripción:</label>
        <input type="text" id="tarea-texto" placeholder="Ej. Sacar el lavavajillas">
      </div>
      <div class="input-row">
        <label>Hora:</label>
        <input type="time" id="tarea-hora" value="18:00">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModales()">Cancelar</button>
        <button class="btn-add" onclick="guardarTarea()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL COMPRA -->
  <div class="modal-bg" id="modal-compra">
    <div class="modal">
      <h3>Añadir producto</h3>
      <div class="input-row">
        <label>Nombre:</label>
        <input type="text" id="compra-texto" placeholder="Ej. Tomate frito">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModales()">Cancelar</button>
        <button class="btn-add" onclick="guardarProducto()">Añadir</button>
      </div>
    </div>
  </div>

  <script>
    var FAMILIA = [
      { id: 'mama', nombre: 'Mamá', edad: '', color: '#e11d48', fondo: '#ffe4e6' },
      { id: 'sergio', nombre: 'Sergio', edad: '23 años', color: '#2563eb', fondo: '#dbeafe' },
      { id: 'david', nombre: 'David', edad: '4 años', color: '#16a34a', fondo: '#dcfce7' }
    ];

    var modoBorrarCompra = false;
    var estado = JSON.parse(localStorage.getItem('dashboard_elpuig_v1')) || {
      tareas: [
        { id: 1, persona: 'sergio', texto: 'Sacar el lavavajillas', hora: '17:30' },
        { id: 2, persona: 'mama', texto: 'Comprar en el supermercado', hora: '18:30' }
      ],
      compra: [
        { id: 'leche', nombre: 'Leche', activo: true },
        { id: 'huevos', nombre: 'Huevos', activo: false },
        { id: 'pan', nombre: 'Pan', activo: true },
        { id: 'platanos', nombre: 'Plátanos', activo: false },
        { id: 'pollo', nombre: 'Pollo', activo: false },
        { id: 'yogures', nombre: 'Yogures', activo: false },
        { id: 'queso', nombre: 'Queso', activo: false },
        { id: 'jamon', nombre: 'Jamón', activo: false },
        { id: 'tomates', nombre: 'Tomates', activo: false }
      ]
    };

    function guardarEstado() {
      localStorage.setItem('dashboard_elpuig_v1', JSON.stringify(estado));
      renderizarTodo();
    }

    function actualizarReloj() {
      try {
        var ahora = new Date();
        var h = ('0' + ahora.getHours()).slice(-2);
        var m = ('0' + ahora.getMinutes()).slice(-2);
        document.getElementById('reloj').innerHTML = h + ':' + m;

        var dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
        var meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        var diaSem = dias[ahora.getDay()];
        var numDia = ahora.getDate();
        var mes = meses[ahora.getMonth()];
        document.getElementById('fecha').innerHTML = diaSem + ', ' + numDia + ' de ' + mes;
      } catch (e) {
        document.getElementById('fecha').innerHTML = 'El Puig de Santa Maria';
      }
      renderizarProximo();
    }

    function cargarClima() {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=39.5889&longitude=-0.3039&current_weather=true&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Europe%2FMadrid';
      
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var actual = data.current_weather;
            document.getElementById('temp-actual').innerHTML = Math.round(actual.temperature) + '°';
            
            var horaActualNum = new Date().getHours();
            var htmlHoras = '';
            var count = 0;
            
            for (var i = 0; i < data.hourly.time.length; i++) {
              var tStr = data.hourly.time[i];
              var hNum = parseInt(tStr.substring(11, 13), 10);
              if (hNum >= horaActualNum && count < 4) {
                var tempH = Math.round(data.hourly.temperature_2m[i]);
                var probH = data.hourly.precipitation_probability[i] || 0;
                var hTxt = ('0' + hNum).slice(-2) + ':00';
                htmlHoras += '<div class="hour-item"><span class="hour-time">' + hTxt + '</span><span class="hour-icon">🌤️</span><span class="hour-temp">' + tempH + '°</span><span class="hour-rain">💧' + probH + '%</span></div>';
                count++;
              }
            }
            if (htmlHoras) {
              document.getElementById('clima-horas').innerHTML = htmlHoras;
            }
          } catch (err) {}
        }
      };
      xhr.send();
    }

    function renderizarProximo() {
      var tarjeta = document.getElementById('tarjeta-proximo');
      if (!estado.tareas || estado.tareas.length === 0) {
        tarjeta.style.background = '#64748b';
        document.getElementById('prox-persona').innerHTML = 'PRÓXIMO HOY';
        document.getElementById('prox-titulo').innerHTML = 'Todo completado';
        document.getElementById('prox-hora').innerHTML = 'Libre';
        document.getElementById('prox-cuenta').innerHTML = '🎉';
        return;
      }
      var ordenadas = estado.tareas.slice().sort(function(a, b) {
        return (a.hora || '23:59').localeCompare(b.hora || '23:59');
      });
      var prox = ordenadas[0];
      var miembro = FAMILIA[0];
      for(var i=0; i<FAMILIA.length; i++) {
        if(FAMILIA[i].id === prox.persona) miembro = FAMILIA[i];
      }

      tarjeta.style.background = miembro.color;
      document.getElementById('prox-persona').innerHTML = 'PRÓXIMO · ' + miembro.nombre.toUpperCase();
      document.getElementById('prox-titulo').innerHTML = prox.texto;
      document.getElementById('prox-hora').innerHTML = prox.hora ? ('Hora: ' + prox.hora) : 'Hoy';
      document.getElementById('prox-cuenta').innerHTML = prox.hora ? prox.hora : 'Hoy';
    }

    function renderizarFamilia() {
      var contenedor = document.getElementById('columnas-familia');
      var html = '';
      for(var f=0; f<FAMILIA.length; f++) {
        var p = FAMILIA[f];
        var tareasPersona = [];
        for(var t=0; t<estado.tareas.length; t++) {
          if(estado.tareas[t].persona === p.id) tareasPersona.push(estado.tareas[t]);
        }

        html += '<div class="person-col" style="border-top-color:' + p.color + '">' +
          '<div class="person-header">' +
            '<span class="person-name" style="color:' + p.color + '">' + p.nombre + '</span>' +
            '<span class="person-age">' + p.edad + '</span>' +
          '</div>';

        if (tareasPersona.length === 0) {
          html += '<div class="empty-msg">Sin tareas</div>';
        } else {
          for(var tp=0; tp<tareasPersona.length; tp++) {
            var item = tareasPersona[tp];
            html += '<div class="task-item" style="background:' + p.fondo + '; color:' + p.color + '" onclick="completarTarea(' + item.id + ')">' +
              (item.hora ? '<span class="task-time">⏰ ' + item.hora + '</span>' : '') +
              '<span>' + item.texto + '</span>' +
            '</div>';
          }
        }
        html += '</div>';
      }
      contenedor.innerHTML = html;
    }

    function completarTarea(id) {
      var nuevas = [];
      for(var i=0; i<estado.tareas.length; i++) {
        if(estado.tareas[i].id !== id) nuevas.push(estado.tareas[i]);
      }
      estado.tareas = nuevas;
      guardarEstado();
    }

    function toggleModoBorrar() {
      modoBorrarCompra = !modoBorrarCompra;
      var btn = document.getElementById('btn-modo-borrar');
      if (modoBorrarCompra) {
        btn.className = 'btn-del-mode active';
        btn.innerHTML = '✓ Listo';
      } else {
        btn.className = 'btn-del-mode';
        btn.innerHTML = '🗑️ Borrar';
      }
      renderizarCompra();
    }

    function renderizarCompra() {
      var grid = document.getElementById('grid-compra');
      var activos = 0;
      var html = '';
      for(var i=0; i<estado.compra.length; i++) {
        var item = estado.compra[i];
        if (item.activo) activos++;
        if (modoBorrarCompra) {
          html += '<button class="shop-btn delete-mode" onclick="eliminarProducto(\'' + item.id + '\')">🗑️ ' + item.nombre + '</button>';
        } else {
          var clase = item.activo ? 'shop-btn active' : 'shop-btn';
          var check = item.activo ? '✅ ' : '';
          html += '<button class="' + clase + '" onclick="toggleCompra(\'' + item.id + '\')">' + check + item.nombre + '</button>';
        }
      }
      grid.innerHTML = html;
      document.getElementById('contador-compra').innerHTML = activos + ' en lista';
    }

    function toggleCompra(id) {
      for(var i=0; i<estado.compra.length; i++) {
        if(estado.compra[i].id === id) {
          estado.compra[i].activo = !estado.compra[i].activo;
        }
      }
      guardarEstado();
    }

    function eliminarProducto(id) {
      var nuevas = [];
      for(var i=0; i<estado.compra.length; i++) {
        if(estado.compra[i].id !== id) nuevas.push(estado.compra[i]);
      }
      estado.compra = nuevas;
      guardarEstado();
    }

    function abrirModalTarea() {
      document.getElementById('tarea-texto').value = '';
      document.getElementById('modal-tarea').style.display = 'flex';
    }
    function ponerTextoTarea(txt) {
      document.getElementById('tarea-texto').value = txt;
    }
    function guardarTarea() {
      var persona = document.getElementById('tarea-persona').value;
      var texto = document.getElementById('tarea-texto').value.trim();
      var hora = document.getElementById('tarea-hora').value;
      if (!texto) return;
      estado.tareas.push({ id: Date.now(), persona: persona, texto: texto, hora: hora });
      cerrarModales();
      guardarEstado();
    }

    function abrirModalCompra() {
      if (modoBorrarCompra) toggleModoBorrar();
      document.getElementById('compra-texto').value = '';
      document.getElementById('modal-compra').style.display = 'flex';
    }
    function guardarProducto() {
      var nombre = document.getElementById('compra-texto').value.trim();
      if (!nombre) return;
      estado.compra.push({ id: 'item_' + Date.now(), nombre: nombre, activo: true });
      cerrarModales();
      guardarEstado();
    }

    function cerrarModales() {
      document.getElementById('modal-tarea').style.display = 'none';
      document.getElementById('modal-compra').style.display = 'none';
    }

    function renderizarTodo() {
      renderizarProximo();
      renderizarFamilia();
      renderizarCompra();
    }

    window.addEventListener('storage', function() {
      var guardado = localStorage.getItem('dashboard_elpuig_v1');
      if (guardado) {
        estado = JSON.parse(guardado);
        renderizarTodo();
      }
    });

    actualizarReloj();
    setInterval(actualizarReloj, 1000);
    cargarClima();
    renderizarTodo();
  </script>
</body>
</html>
